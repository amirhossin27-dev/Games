name: Tests & Veröffentlichung

on:
  push:
    branches: [main, claude/zealous-cori-pcaegq]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Joys eigene Stimmen (Piper, CC0) – einmal laden, danach aus dem Cache der Actions
      - uses: actions/cache@v4
        with:
          path: public/voice/models
          key: piper-voices-${{ hashFiles('scripts/voices.mjs') }}
      - run: node scripts/voices.mjs models
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
