<style>
#joy-kart-simple{width:100%;color:#fff0d4;font:14px/1.4 'Segoe UI',sans-serif}
#joy-kart-simple *{box-sizing:border-box}
#joy-kart-simple [hidden]{display:none!important}
#joy-kart-simple .js-stage{position:relative;width:100%;aspect-ratio:19.5/9;min-height:240px;overflow:hidden;border-radius:18px;background:#102637;isolation:isolate;container-type:inline-size;--js-left:env(safe-area-inset-left,0px);--js-right:env(safe-area-inset-right,0px);--js-bottom:env(safe-area-inset-bottom,0px)}
#joy-kart-simple canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#joy-kart-simple .js-rush{position:absolute;inset:-5%;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 5deg at 50% 46%,transparent 0deg 14deg,#fff0cd99 14.05deg 14.3deg,transparent 14.35deg 30deg);-webkit-mask-image:radial-gradient(ellipse at 50% 46%,transparent 0% 60%,#000 100%);mask-image:radial-gradient(ellipse at 50% 46%,transparent 0% 60%,#000 100%)}
@media(prefers-reduced-motion:reduce){#joy-kart-simple .js-rush{display:none}}
#joy-kart-simple button{font:inherit;color:inherit;min-width:44px;min-height:44px;border:1px solid #edd49b80;border-radius:12px;background:#102637ee;padding:8px 12px;touch-action:manipulation}
#joy-kart-simple .js-top{position:absolute;top:8px;left:max(12px,calc(var(--js-left) + 8px));right:max(12px,calc(var(--js-right) + 8px));display:flex;gap:12px;align-items:start;justify-content:space-between;pointer-events:none;text-shadow:0 2px 5px #000}
#joy-kart-simple .js-location{font-size:12px;padding-top:3px}
#joy-kart-simple .js-location small{display:block;font-size:11px;color:#e0d7c4}
#joy-kart-simple .js-time{font-variant-numeric:tabular-nums;font-size:17px;margin-left:auto}
#joy-kart-simple .js-top button{pointer-events:auto;width:44px;padding:8px}
#joy-kart-simple .js-controls{position:absolute;left:max(12px,calc(var(--js-left) + 8px));right:max(12px,calc(var(--js-right) + 8px));bottom:max(10px,calc(var(--js-bottom) + 6px));display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#joy-kart-simple .js-controls button{width:clamp(80px,14cqw,108px);height:clamp(80px,14cqw,108px);border-radius:50%;padding:0;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#joy-kart-simple .js-pad{position:relative;background:#102637ce;box-shadow:inset 0 0 0 6px #fff1d508}
#joy-kart-simple .js-thumb{position:absolute;width:32%;height:32%;border-radius:50%;background:#efd196;left:34%;top:22%;transform:translateX(calc(var(--js-steer,0)*78%));pointer-events:none}
#joy-kart-simple .js-pad-label{position:absolute;bottom:12%;left:0;right:0;font-size:12px;pointer-events:none}
#joy-kart-simple .js-turbo{border:2px solid #efd196;background:radial-gradient(#775e35,#102637);font-weight:700;display:grid;place-content:center;gap:2px}
#joy-kart-simple .js-turbo small{font-size:11px;font-weight:400}
#joy-kart-simple .js-turbo:disabled{border-color:#9c9e94;background:#102637d9;color:#d0d1c7}
#joy-kart-simple .js-speed{position:absolute;bottom:max(14px,calc(var(--js-bottom) + 10px));left:35%;right:35%;text-align:center;text-shadow:0 2px 5px #000;pointer-events:none;font-variant-numeric:tabular-nums}
#joy-kart-simple .js-speed strong{font-size:clamp(24px,4cqw,34px)}
#joy-kart-simple .js-speed small{font-size:11px}
#joy-kart-simple .js-overlay{position:absolute;inset:0;z-index:5;background:linear-gradient(90deg,#091925ed,#09192560);display:flex;align-items:center;justify-content:center;padding:16px}
#joy-kart-simple .js-panel{width:min(340px,100%);display:grid;gap:10px}
#joy-kart-simple h2{font-size:clamp(25px,4cqw,36px);line-height:1.05;margin:0}
#joy-kart-simple p{margin:0;font-size:13px;color:#e1e3db}
#joy-kart-simple .js-actions{display:flex;gap:8px}
#joy-kart-simple .js-primary{background:linear-gradient(115deg,#fff2cc,#e9be70);color:#102637;font-weight:700;flex:1}
#joy-kart-simple .js-count{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;font-weight:700;text-shadow:0 3px 10px #000;pointer-events:none}
#joy-kart-simple .js-toast{position:absolute;top:24%;left:25%;right:25%;text-align:center;text-shadow:0 2px 5px #000;font-size:17px;font-weight:700;pointer-events:none}
#joy-kart-simple .js-loading{position:absolute;inset:0;z-index:9;background:#102637;display:grid;place-content:center;gap:8px;text-align:center;padding:16px}
#joy-kart-simple .js-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:380px){#joy-kart-simple .js-location{font-size:11px}#joy-kart-simple .js-time{font-size:14px}#joy-kart-simple .js-top{gap:6px}#joy-kart-simple .js-toast{font-size:14px;left:20%;right:20%}}
</style>
<div id="joy-kart-simple" aria-label="Joy-Kart – einfache Küstenprobe">
 <div class="js-stage">
  <canvas aria-label="Dreidimensionale Küstenstraße mit Fuchskart und durchgehendem Unterbau"></canvas>
  <div class="js-rush" aria-hidden="true"></div>
  <div class="js-top"><span class="js-location">Sonnenküste · Teststrecke<small>Auto-Gas · Lenkhilfe</small></span><span class="js-time">00:00.00</span><button type="button" data-action="pause" aria-label="Pause" class="cursor-interaction" hidden>Ⅱ</button></div>
  <div class="js-controls" hidden><button type="button" class="js-pad cursor-interaction" data-control="pad" aria-label="Lenken: halten und nach links oder rechts ziehen"><span class="js-thumb"></span><span class="js-pad-label">Lenken</span></button><button type="button" class="js-turbo cursor-interaction" data-action="turbo">TURBO<small>tippen</small></button></div>
  <div class="js-speed" hidden><strong>0</strong><small> km/h</small></div>
  <div class="js-count" hidden></div><div class="js-toast" role="status" aria-live="polite"></div>
  <div class="js-overlay"><div class="js-panel"><h2>Joy-Kart</h2><p>Links sanft lenken, rechts Turbo tippen.<br>Auto-Gas und Lenkhilfe sind aktiv.</p><div class="js-actions"><button type="button" class="js-primary cursor-interaction" data-action="start">Losfahren</button><button type="button" class="cursor-interaction" data-action="again" hidden>Neu starten</button></div></div></div>
  <div class="js-loading" role="status" aria-live="polite"><strong>Küstenprobe wird vorbereitet</strong><span>Grafik wird geladen …</span></div><span class="js-live" role="status" aria-live="polite"></span>
 </div>
</div>
<script>
(async()=>{
/*@@SIMPLE_ENGINE@@*/
/*@@BATCHING@@*/
/*@@MODELS@@*/
/*@@CHARACTERS@@*/
/*@@PRODUCTION_MODELS@@*/
/*@@PRODUCTION_COAST@@*/
/*@@LIGHTING@@*/
/*@@SIMPLE_WORLD@@*/
const root=document.getElementById('joy-kart-simple'),find=q=>root.querySelector(q),stage=find('.js-stage'),canvas=find('canvas'),loading=find('.js-loading'),loadingText=loading.querySelector('span');
const M=createCoastSimpleModule(),{course,clamp}=M,race=new M.SimpleRace(),held=new Map(),keys=new Set(),started=performance.now(),startup={marks:[]};
let stopped=false,ready=false,renderer,animation,lastPhase='ready',toastUntil=0,testInput=null,lastHud=0;
const mark=name=>startup.marks.push({name,ms:Math.round(performance.now()-started)}),persist=()=>window.openai?.setWidgetState?.({modelContent:{spiel:'Joy-Kart einfache Küstenprobe',phase:race.phase,lenkhilfe:true,extras:'Turbo'},privateContent:null})?.catch(()=>{});
const toast=text=>{find('.js-toast').textContent=text;toastUntil=performance.now()+1100;find('.js-live').textContent=text;};
function input(){if(testInput!==null)return testInput;let steer=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0);for(const p of held.values())steer+=p.value;return clamp(steer,-1,1);}
function clear(){held.clear();keys.clear();testInput=null;stage.style.setProperty('--js-steer',0);}
function pause(){clear();race.pause();syncUI();}
function syncUI(){const phase=race.phase;if(phase===lastPhase)return;lastPhase=phase;const overlay=['ready','paused','finished'].includes(phase);find('.js-overlay').hidden=!overlay;find('.js-controls').hidden=overlay;find('.js-speed').hidden=overlay;find('[data-action="pause"]').hidden=overlay;find('.js-count').hidden=phase!=='countdown';find('[data-action="again"]').hidden=phase!=='paused';find('h2').textContent=phase==='paused'?'Pause':phase==='finished'?'Ziel erreicht':'Joy-Kart';find('p').innerHTML=phase==='finished'?'Küstenprobe geschafft.<br>Auto-Gas · Lenkhilfe · Turbo':phase==='paused'?'Bereit für die nächste Kurve?':'Links sanft lenken, rechts Turbo tippen.<br>Auto-Gas und Lenkhilfe sind aktiv.';find('[data-action="start"]').textContent=phase==='paused'?'Weiterfahren':phase==='finished'?'Noch einmal':'Losfahren';if(overlay){toastUntil=0;find('.js-toast').textContent='';}persist();}
function bindInputs(){
 find('[data-action="start"]').addEventListener('click',()=>{if(!ready)return;clear();if(race.phase==='paused')race.resume();else race.begin();syncUI();});
 find('[data-action="again"]').addEventListener('click',()=>{clear();race.reset();syncUI();});find('[data-action="pause"]').addEventListener('click',pause);
 const turbo=find('[data-action="turbo"]');
 // A held first finger can suppress the second finger's compatibility click on mobile.
 // Keep focus on the held pad: disabling a consumed turbo must not steal or clear its pointer.
 turbo.addEventListener('pointerdown',e=>{if(e.button!==0||turbo.disabled)return;e.preventDefault();race.queueTurbo();});
 turbo.addEventListener('click',e=>{if(e.detail===0)race.queueTurbo();});
 const pad=find('[data-control="pad"]');
 pad.addEventListener('pointerdown',e=>{if(race.phase!=='running'||held.size)return;e.preventDefault();pad.focus();held.set(e.pointerId,{x:e.clientX,value:0});pad.setPointerCapture(e.pointerId);});
 pad.addEventListener('pointermove',e=>{const p=held.get(e.pointerId);if(!p)return;e.preventDefault();const v=clamp((e.clientX-p.x)/(pad.clientWidth*.4),-1,1);p.value=Math.abs(v)<.06?0:Math.sign(v)*(Math.abs(v)-.06)/.94;});
 for(const event of['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(event,e=>held.delete(e.pointerId));
 root.addEventListener('keydown',e=>{if(e.code==='Escape'){pause();return;}if(race.phase!=='running')return;if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code)){e.preventDefault();keys.add(e.code);}if(e.code==='KeyE'&&!e.repeat){e.preventDefault();race.queueTurbo();}});root.addEventListener('keyup',e=>keys.delete(e.code));root.addEventListener('focusout',e=>{if(!root.contains(e.relatedTarget))clear();});
 window.addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
}
const decode=async url=>{const image=new Image();image.src=url;await image.decode();return image;},paintYield=()=>new Promise(resolve=>requestAnimationFrame(()=>resolve()));
try{
 const [THREE,atlasImage,skyImage]=await Promise.all([import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'),decode(/*@@MATERIAL_ATLAS@@*/),decode(/*@@SKY_TEXTURE@@*/)]);mark('download');loadingText.textContent='Fuchs und Kart werden vorbereitet …';await paintYield();
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,1,.15,900),materials=new Set(),geometries=new Set(),textures=new Set();
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 function texture(w,h,paint){const c=document.createElement('canvas');c.width=w;c.height=h;paint(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;textures.add(t);return t;}
 const part=(x,y)=>{const half=atlasImage.width/2,t=texture(512,512,(c,w,h)=>c.drawImage(atlasImage,x*half,y*half,half,half,0,0,w,h));t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());return t;};
 const artMaps={orangeFur:part(0,0),creamFur:part(1,0),asphalt:part(0,1),stone:part(1,1)};artMaps.furNeutral=texture(256,256,(c,w,h)=>{c.drawImage(artMaps.creamFur.image,0,0,w,h);const p=c.getImageData(0,0,w,h);for(let i=0;i<p.data.length;i+=4){const l=205+((p.data[i]+p.data[i+1]+p.data[i+2])/3-128)*.25;p.data[i]=p.data[i+1]=p.data[i+2]=l;}c.putImageData(p,0,0);});for(const t of[artMaps.furNeutral,artMaps.creamFur,artMaps.orangeFur]){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);}
 const lighting=createProductionLighting(THREE,{scene,renderer,skyImage,texture,textures,materials,geometries}),kit=createKartModels(THREE,{scene,geometries,materials,texture}),assets=createProductionKarts(THREE,{scene,kit,artMaps,materials,texture}),hero=assets.makeKart(false);mark('fox-kart');loadingText.textContent='Küstenstraße wird aufgebaut …';await paintYield();
 const world=await createSimpleCoastWorld(THREE,{scene,course,kit,artMaps,materials,texture,lighting,yieldTask:paintYield});mark('coast');loadingText.textContent='Licht wird vorbereitet …';await paintYield();
 const cameraDesired=new THREE.Vector3(),lookDesired=new THREE.Vector3(),look=new THREE.Vector3(),motion=matchMedia('(prefers-reduced-motion: reduce)'),rush=find('.js-rush');let cameraSet=false,frames=0,fps=0,frameWindow=performance.now(),lastFrame=performance.now(),lastCameraAngle=0,maxCameraStep=0,lastDrawS=0,speedVisual=0;
 function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}const observer=new ResizeObserver(resize);observer.observe(stage);resize();
 function place(dt,render=true){
  const k=race.k,p=course.point(k.s,k.lat),f=course.frame(k.s),dx=Math.sin(f.angle),dz=Math.cos(f.angle),yaw=Math.atan2(dx*k.v+f.nx*k.latV,dz*k.v+f.nz*k.latV);
  hero.group.position.set(p.x,p.y+.06,p.z);hero.group.rotation.y=k.v>.1?yaw:f.angle;hero.body.rotation.z=-k.steer*.035;hero.body.rotation.x=-Math.atan((course.height(k.s+.2)-course.height(k.s-.2))/.4);hero.animate(k.v/M.SPEED.turbo,k.steer,k.boost>0,race.time);
  for(const w of hero.wheels){w.spin.rotation.x+=k.v*dt/.47;if(w.front)w.pivot.rotation.y=-k.steer*.25;}
  hero.shadow.position.set(p.x,p.y+.04,p.z);hero.shadow.rotation.z=-hero.group.rotation.y;world.update(race.time,race.taken);
  const centre=course.point(k.s,k.lat*.65),ahead=course.point(k.s+11,k.lat*.35);cameraDesired.set(centre.x-dx*8.5,p.y+3.4,centre.z-dz*8.5);lookDesired.set(ahead.x,ahead.y+1.05,ahead.z);
  if(k.s<lastDrawS-.1){cameraSet=false;maxCameraStep=0;speedVisual=0;}lastDrawS=k.s;const snapped=!cameraSet;
  if(snapped){camera.position.copy(cameraDesired);look.copy(lookDesired);cameraSet=true;}else{const alpha=1-Math.exp(-dt*9);camera.position.lerp(cameraDesired,alpha);look.lerp(lookDesired,alpha);}camera.lookAt(look);
  const angle=Math.atan2(look.x-camera.position.x,look.z-camera.position.z);if(render&&!snapped)maxCameraStep=Math.max(maxCameraStep,Math.abs(Math.atan2(Math.sin(angle-lastCameraAngle),Math.cos(angle-lastCameraAngle))));lastCameraAngle=angle;
  const target=race.phase==='running'&&k.boost>0?1:0;speedVisual=motion.matches?0:speedVisual+(target-speedVisual)*(1-Math.exp(-dt*(target?10:5)));
  const fov=60+speedVisual*8;if(Math.abs(camera.fov-fov)>.001){camera.fov=fov;camera.updateProjectionMatrix();}
  rush.style.opacity=(race.phase==='running'?speedVisual*.6:0).toFixed(3);
  lighting.update(camera,p.x,p.y,p.z);if(render)renderer.render(scene,camera);
 }
 // Establish the rear view before shader preparation; prewarm turbo's first-use material too.
 place(0,false);hero.flames.visible=true;if(renderer.compileAsync)await renderer.compileAsync(scene,camera);hero.flames.visible=false;mark('shaders');place(0);mark('ready');startup.readyMs=Math.round(performance.now()-started);
 bindInputs();loading.hidden=true;ready=true;syncUI();
 function hud(now){find('.js-speed strong').textContent=Math.round(race.k.v*3.6);find('.js-time').textContent=new Date(Math.round(race.time*1000)).toISOString().slice(14,22);find('.js-count').textContent=Math.max(1,Math.ceil(race.countdown));const turbo=find('[data-action="turbo"]');turbo.disabled=!race.k.item||race.phase!=='running';turbo.innerHTML=race.k.item?'TURBO<small>tippen</small>':race.k.boost>0?'TURBO<small>aktiv</small>':'TURBO<small>Box sammeln</small>';if(now>toastUntil)find('.js-toast').textContent='';}
 function loop(now){if(stopped)return;if(!root.isConnected){stopped=true;observer.disconnect();renderer.dispose();for(const s of[geometries,materials,textures])for(const v of s)v.dispose();return;}const dt=Math.min((now-lastFrame)/1000,.1);lastFrame=now;race.advance(dt,input());for(const event of race.takeEvents()){if(event==='go')toast('LOS!');if(event==='turbo')toast('Turbo!');if(event==='pickup')toast('Turbo bereit');}syncUI();stage.style.setProperty('--js-steer',input());place(dt);if(now-lastHud>80){hud(now);lastHud=now;}frames++;if(now-frameWindow>1000){fps=Math.round(frames*1000/(now-frameWindow));frames=0;frameWindow=now;}animation=requestAnimationFrame(loop);}
 root.__joyKartSimple={snapshot:()=>({...race.snapshot(),version:'coast-simple-v2',role:'assisted-practice',input:{steer:input(),heldPointers:held.size},startup,geometry:world.geometry,render:{fps,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,pixelRatio:renderer.getPixelRatio(),camera:camera.position.toArray(),look:look.toArray(),maxCameraStep,speedEffect:{strength:speedVisual,fov:camera.fov,streakOpacity:Number(rush.style.opacity)||0,reducedMotion:motion.matches}}}),inspectGeometry:world.inspectGeometry,setTestInput:value=>{testInput=value===null?null:clamp(Number(value)||0,-1,1);},course};
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();pause();stopped=true;cancelAnimationFrame(animation);loading.hidden=false;loadingText.textContent='Grafik unterbrochen. Bitte die Seite neu laden.';});lastFrame=performance.now();animation=requestAnimationFrame(loop);
}catch(error){stopped=true;loading.hidden=false;loading.querySelector('strong').textContent='Küstenprobe konnte nicht starten';loadingText.textContent=error.message;console.error(error);renderer?.dispose();}
})();
</script>
